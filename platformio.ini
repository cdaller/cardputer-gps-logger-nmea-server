; GPS Logger for M5Stack Cardputer / Cardputer ADV
[platformio]
default_envs = cardputer

[env:cardputer]
platform = espressif32@6.10.0
board = m5stack-stamps3
framework = arduino
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    m5stack/M5Cardputer@^1.1.1
    mikalhart/TinyGPSPlus@^1.1.0
extra_scripts = post:scripts/merge_bin.py
build_src_filter = +<*> -<ledtest/>

; Separate LED test firmware: pio run -e testled -> dist/testled.bin
[env:testled]
extends = env:cardputer
build_src_filter = +<ledtest/>
